[project]
name = "binary-dependency-directory"
version = "1.0.0"
dependencies = [
    "library @ ../../core_functionality/library/"
]

[build-system]
requires = ["poexy-core"]
build-backend = "poexy_core.api"

[tool.poexy.package.binary-dependency-directory]
source = "src"

[tool.poexy.wheel]
format = ["binary"]

[tool.poexy.binary]
name = "binary-dependency-directory"
entry_point = "src.__init__"